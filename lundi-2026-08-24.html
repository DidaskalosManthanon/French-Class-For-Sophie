  <style>
    :root {
      --primary: #e10600; /* F1 Red */
      --primary-hover: #b30500;
      --bg: #0f1115;
      --card-bg: #1a1d24;
      --text: #f1f1f1;
      --text-muted: #a0a5b1;
      --accent: #38ef7d;
      --border: #2a2e39;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    /* Top bar for Language Switcher */
    .top-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-bottom: 10px;
    }

    .lang-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      background-color: var(--card-bg);
      border: 2px solid var(--border);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: bold;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .lang-btn:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    /* Flag Icons */
    .flag-icon {
      width: 28px;
      height: 20px;
      border-radius: 3px;
      box-shadow: 0 0 4px rgba(0,0,0,0.5);
      display: inline-block;
      overflow: hidden;
      position: relative;
    }

    /* French Flag */
    .flag-fr {
      background: linear-gradient(90deg, #002395 0%, #002395 33.33%, #fff 33.33%, #fff 66.66%, #ed2939 66.66%, #ed2939 100%);
    }

    .flag-en-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    header {
      text-align: center;
      padding: 20px 0 30px 0;
      border-bottom: 2px solid var(--primary);
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 2.2rem;
      color: var(--text);
      margin-bottom: 10px;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .video-section {
      background-color: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      margin-bottom: 40px;
    }

    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 ratio */
      height: 0;
      overflow: hidden;
      border-radius: 8px;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .quiz-section, .vocab-section {
      background-color: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      margin-bottom: 40px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    h2 {
      color: var(--primary);
      margin-bottom: 20px;
      font-size: 1.6rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .question-card {
      background-color: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .question-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 15px;
    }

    .question-category {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .cat-compréhension, .cat-comprehension { background-color: #2196F3; color: white; }
    .cat-vocabulaire, .cat-vocabulary { background-color: #9C27B0; color: white; }
    .cat-grammaire, .cat-grammar { background-color: #FF9800; color: white; }
    .cat-prononciation, .cat-pronunciation { background-color: #4CAF50; color: white; }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    @media (min-width: 600px) {
      .options-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .btn-option {
      background-color: #252932;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 15px;
      border-radius: 6px;
      cursor: pointer;
      text-align: left;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .btn-option:hover:not([disabled]) {
      background-color: #323745;
      border-color: var(--primary);
    }

    .btn-option.correct {
      background-color: #1e4620 !important;
      border-color: #38ef7d !important;
      color: #ffffff;
    }

    .btn-option.incorrect {
      background-color: #4a1c1d !important;
      border-color: #ff4e50 !important;
      color: #ffffff;
    }

    .feedback {
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      display: none;
    }

    .feedback.show {
      display: block;
    }

    .feedback.correct-bg {
      background-color: rgba(56, 239, 125, 0.1);
      border: 1px solid var(--accent);
      color: #a3f7bf;
    }

    .feedback.incorrect-bg {
      background-color: rgba(255, 78, 80, 0.1);
      border: 1px solid #ff4e50;
      color: #ff9e9e;
    }

    #score-board {
      display: none;
      text-align: center;
      background: linear-gradient(135deg, #1a1d24, #2a0808);
      padding: 30px;
      border-radius: 12px;
      border: 2px solid var(--primary);
      margin-top: 30px;
    }

    #score-board h3 {
      font-size: 1.8rem;
      margin-bottom: 10px;
    }

    #score-board p {
      font-size: 1.2rem;
      margin-bottom: 20px;
    }

    .vocab-item {
      border-bottom: 1px solid var(--border);
      padding: 15px 0;
    }

    .vocab-item:last-child {
      border-bottom: none;
    }

    .vocab-term {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--primary);
    }

    .vocab-translation {
      font-style: italic;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .vocab-def {
      margin-bottom: 8px;
    }

    .vocab-example {
      background-color: rgba(255, 255, 255, 0.03);
      padding: 10px;
      border-left: 3px solid var(--primary);
      font-size: 0.95rem;
    }

    .btn-reset {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-reset:hover {
      background-color: var(--primary-hover);
    }
  </style>
</head>

  <!-- Section Vidéo -->

const quizData = {
  fr: [
    { cat: "compréhension", q: "1. Quelle œuvre d'art l'auteur utilise-t-il comme métaphore principale pour analyser le Grand Prix ?", options: ["La Joconde de Léonard de Vinci", "La Grande Vague de Kanagawa de Hokusai", "Le Penseur de Rodin", "Le Cri d'Edvard Munch"], answer: 1, explain: "L'auteur compare l'évolution du Grand Prix du Japon à l'estampe 'La Grande Vague de Kanagawa' d'Hokusai." },
    { cat: "compréhension", q: "2. Quel pilote a remporté le Grand Prix du Japon 2026 évoqué dans la vidéo ?", options: ["George Russell", "Oscar Piastri", "Kimi Antonelli", "Max Verstappen"], answer: 2, explain: "Kimi Antonelli a décroché sa deuxième victoire en carrière sur le circuit de Suzuka." },

    { cat: "vocabulaire", q: "7. Que signifie l'expression « titiller l'écurie » ?", options: ["Provoquer ou taquiner de près un concurrent", "Acheter une nouvelle équipe", "Abandonner la course", "Féliciter un pilote"], answer: 0, explain: "'Titiller' signifie agacer légèrement ou venir concurrencer de très près." },

    { cat: "vocabulaire", q: "10. Qu'est-ce qu'une « estampe » ?", options: ["Un type de moteur hybride", "Une image imprimée au moyen d'une planche gravée", "Un virage très serré", "Un casque de pilote"], answer: 1, explain: "Une estampe est une œuvre d'art imprimée (comme les gravures sur bois d'Hokusai)." },
    { cat: "grammaire", q: "11. Identifiez le mode verbal dans : « Si tant est que la tempête [...] accepte de se laisser dompter ».", options: ["Indicatif présent", "Subjonctif présent", "Conditionnel présent", "Impératif"], answer: 1, explain: "La locution 'si tant est que' est toujours suivie du subjonctif ('accepte')." },

    { cat: "vocabulary", q: "9. What does « annihiler » mean in context: « annihile tout l'intérêt de son style »?", options: ["To double", "To destroy completely, render null", "To significantly improve", "To make famous"], answer: 1, explain: "'Annihiler' comes from Latin *nihil* (nothing), meaning to reduce to nothing." },

    { cat: "grammar", q: "13. « A contrario, et cela en dit tout aussi long, George Russell... » What does 'a contrario' express?", options: ["Addition of arguments", "A sharp contrast or opposition", "A logical conclusion", "A repetition"], answer: 1, explain: "'A contrario' highlights a direct contrast between two situations." },

    { cat: "pronunciation", q: "19. How many spoken syllables does the word 'sérénité' have?", options: ["2 syllables", "3 syllables", "4 syllables (sé-ré-ni-té)", "5 syllables"], answer: 2, explain: "The word 'sérénité' breaks cleanly into 4 spoken syllables: sé-ré-ni-té." },

let userAnswers = new Array(quizData.fr.length).fill(null);

function updateStaticText() {
  const texts = contentData[currentLang];
  document.documentElement.lang = currentLang;
  
  document.getElementById("header-title").innerHTML = texts.headerTitle;
  document.getElementById("header-subtitle").innerHTML = texts.headerSubtitle;
  document.getElementById("title-video").innerHTML = texts.titleVideo;
  document.getElementById("title-quiz").innerHTML = texts.titleQuiz;
  document.getElementById("title-vocab").innerHTML = texts.titleVocab;
  document.getElementById("score-title").innerHTML = texts.scoreTitle;
  document.getElementById("btn-reset").innerHTML = texts.btnReset;

  const flagContainer = document.getElementById("flag-container");
  const langText = document.getElementById("lang-btn-text");

  if (currentLang === "fr") {
    flagContainer.className = "flag-icon";
    flagContainer.innerHTML = `
      <svg class="flag-en-svg" viewBox="0 0 28 20" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="top-left-diagonal"><polygon points="0,0 28,0 0,20"/></clipPath>
          <clipPath id="bottom-right-diagonal"><polygon points="28,0 28,20 0,20"/></clipPath>
        </defs>

          <rect y="14.25" width="28" height="2.85" fill="#FFFFFF"/>
          <rect width="11.2" height="10.8" fill="#3C3B6E"/>

          <circle cx="7.4" cy="5.4" r="0.6" fill="#FFF"/>
          <circle cx="2" cy="8.8" r="0.6" fill="#FFF"/>
          <circle cx="5.6" cy="8.8" r="0.6" fill="#FFF"/>
          <circle cx="9.2" cy="8.8" r="0.6" fill="#FFF"/>
        </g>
        <g clip-path="url(#bottom-right-diagonal)">
          <rect width="28" height="20" fill="#00247D"/>

          <line x1="28" y1="0" x2="0" y2="20" stroke="#FFFFFF" stroke-width="4"/>
          <line x1="0" y1="0" x2="28" y2="20" stroke="#CF142B" stroke-width="1.5"/>
          <line x1="28" y1="0" x2="0" y2="20" stroke="#CF142B" stroke-width="1.5"/>

function toggleLanguage() {
  currentLang = currentLang === "fr" ? "en" : "fr";
  updateStaticText();
  renderQuiz();
  renderVocab();

  if (userAnswers.every(ans => ans !== null)) {
    checkQuizCompletion();
  }
}

function renderQuiz() {
  const container = document.getElementById("quiz-container");
  container.innerHTML = "";
  const currentQuiz = quizData[currentLang];

  currentQuiz.forEach((q, index) => {
    const card = document.createElement("div");
    card.className = "question-card";

    let catClass = `cat-${q.cat}`;
    
    card.innerHTML = `
      <span class="question-category ${catClass}">${q.cat}</span>
      <div class="question-title">${q.q}</div>
      <div class="options-grid">
        ${q.options.map((opt, i) => `
          <button class="btn-option" id="opt-${index}-${i}" onclick="selectAnswer(${index}, ${i})">
            ${String.fromCharCode(65 + i)}. ${opt}
          </button>
        `).join('')}
      </div>
      <div class="feedback" id="feedback-${index}"></div>
    `;

    container.appendChild(card);

    if (userAnswers[index] !== null) {
      applyAnswerState(index, userAnswers[index]);
    }
  });
}

function selectAnswer(qIndex, optIndex) {
  if (userAnswers[qIndex] !== null) return;

  userAnswers[qIndex] = optIndex;
  applyAnswerState(qIndex, optIndex);
  checkQuizCompletion();
}

function applyAnswerState(qIndex, optIndex) {
  const q = quizData[currentLang][qIndex];
  const texts = contentData[currentLang];
  const feedbackEl = document.getElementById(`feedback-${qIndex}`);

  for (let i = 0; i < q.options.length; i++) {
    const btn = document.getElementById(`opt-${qIndex}-${i}`);
    if (!btn) continue;
    btn.disabled = true;
    if (i === q.answer) {
      btn.classList.add("correct");
    } else if (i === optIndex) {
      btn.classList.add("incorrect");
    }
  }

  if (feedbackEl) {
    feedbackEl.classList.add("show");
    if (optIndex === q.answer) {
      feedbackEl.classList.add("correct-bg");
      feedbackEl.classList.remove("incorrect-bg");
      feedbackEl.innerHTML = `<strong>✅ ${texts.bravo}</strong> ${q.explain}`;
    } else {
      feedbackEl.classList.add("incorrect-bg");
      feedbackEl.classList.remove("correct-bg");
      feedbackEl.innerHTML = `<strong>❌ ${texts.incorrect}</strong> ${texts.correctAnswerWas} <strong>${String.fromCharCode(65 + q.answer)}</strong>.<br>${q.explain}`;
    }
  }
}

function checkQuizCompletion() {
  const allAnswered = userAnswers.every(ans => ans !== null);
  if (allAnswered) {
    const currentQuiz = quizData[currentLang];
    const score = userAnswers.reduce((total, ans, idx) => {
      return ans === currentQuiz[idx].answer ? total + 1 : total;
    }, 0);

    const scoreBoard = document.getElementById("score-board");
    const scoreText = document.getElementById("score-text");
    const pct = Math.round((score / currentQuiz.length) * 100);
    
    scoreText.innerHTML = contentData[currentLang].scoreTemplate(score, currentQuiz.length, pct);
    scoreBoard.style.display = "block";
  }
}

function resetQuiz() {
  userAnswers = new Array(quizData.fr.length).fill(null);
  document.getElementById("score-board").style.display = "none";
  renderQuiz();
  window.scrollTo({ top: document.querySelector('.quiz-section').offsetTop, behavior: 'smooth' });
}

function renderVocab() {
  const container = document.getElementById("vocab-container");
  container.innerHTML = "";
  const currentVocab = vocabData[currentLang];
  const texts = contentData[currentLang];

  currentVocab.forEach(v => {
    const item = document.createElement("div");
    item.className = "vocab-item";
    item.innerHTML = `
      <div class="vocab-term">${v.term}</div>
      <div class="vocab-translation">${texts.transLabel}${v.trans}</div>
      <div class="vocab-def"><strong>${texts.defLabel}</strong> ${v.def}</div>
      <div class="vocab-example"><em>${texts.exLabel}</em> ${v.ex}</div>
    `;
    container.appendChild(item);
  });
}

// Premier rendu
updateStaticText();
renderQuiz();
renderVocab();
</script>
