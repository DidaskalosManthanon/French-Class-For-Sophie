let userAnswers = new Array(quizData.length).fill(null);

function renderQuiz() {
  const container = document.getElementById("quiz-container");
  container.innerHTML = "";

  quizData.forEach((q, index) => {
    const card = document.createElement("div");
    card.className = "question-card";

    let catClass = `cat-${q.cat}`;
    
    card.innerHTML = `
      <span class="question-category ${catClass}">${q.cat}</span>
      <div class="question-title">${q.q}</div>
      <div class="options-grid">
        ${q.options.map((opt, i) => `
          <button class="btn-option" id="opt-${index}-${i}" onclick="selectAnswer(${index}, ${i})">
            ${String.fromCharCode(65 + i)}. ${opt}
          </button>
        `).join('')}
      </div>
      <div class="feedback" id="feedback-${index}"></div>
    `;

    container.appendChild(card);
  });
}

function selectAnswer(qIndex, optIndex) {
  if (userAnswers[qIndex] !== null) return;

  userAnswers[qIndex] = optIndex;
  const q = quizData[qIndex];
  const feedbackEl = document.getElementById(`feedback-${qIndex}`);

  for (let i = 0; i < q.options.length; i++) {
    const btn = document.getElementById(`opt-${qIndex}-${i}`);
    btn.disabled = true;
    if (i === q.answer) {
      btn.classList.add("correct");
    } else if (i === optIndex) {
      btn.classList.add("incorrect");
    }
  }

  feedbackEl.classList.add("show");
  if (optIndex === q.answer) {
    feedbackEl.classList.add("correct-bg");
    feedbackEl.innerHTML = `<strong>✅ Excellent !</strong> ${q.explain}`;
  } else {
    feedbackEl.classList.add("incorrect-bg");
    feedbackEl.innerHTML = `<strong>❌ Réponse incorrecte.</strong> La bonne réponse était la <strong>${String.fromCharCode(65 + q.answer)}</strong>.<br>${q.explain}`;
  }

  checkQuizCompletion();
}

function checkQuizCompletion() {
  const allAnswered = userAnswers.every(ans => ans !== null);
  if (allAnswered) {
    const score = userAnswers.reduce((total, ans, idx) => {
      return ans === quizData[idx].answer ? total + 1 : total;
    }, 0);

    const scoreBoard = document.getElementById("score-board");
    const scoreText = document.getElementById("score-text");
    
    scoreText.innerHTML = `Score obtenu : <strong>${score} / ${quizData.length}</strong> (${Math.round((score/quizData.length)*100)}%).`;
    scoreBoard.style.display = "block";
    scoreBoard.scrollIntoView({ behavior: 'smooth' });
  }
}

function resetQuiz() {
  userAnswers = new Array(quizData.length).fill(null);
  document.getElementById("score-board").style.display = "none";
  renderQuiz();
  window.scrollTo({ top: document.querySelector('.quiz-section').offsetTop, behavior: 'smooth' });
}

function renderExpressions() {
  const container = document.getElementById("expressions-container");
  container.innerHTML = "";

  expressionsData.forEach(item => {
    const card = document.createElement("div");
    card.className = "expression-card";
    card.innerHTML = `
      <img src="${item.img}" alt="${item.title}" class="expression-img">
      <div class="expression-content">
        <div class="expression-title">${item.title}</div>
        <div class="expression-trans">🇬🇧 ${item.trans}</div>
        <div class="expression-ex"><strong>Exemple concret :</strong> ${item.ex}</div>
      </div>
    `;
    container.appendChild(card);
  });
}

// Initialisation
renderQuiz();
renderExpressions();
</script>

</body>
</html>
